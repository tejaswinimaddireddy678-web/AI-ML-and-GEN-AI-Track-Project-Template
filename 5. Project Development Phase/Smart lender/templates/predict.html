<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Lender - Loan Prediction</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">🏦 Smart Lender</a>

        <div class="ms-auto">
            <a href="/" class="btn btn-outline-light me-2">Home</a>
            <a href="/about" class="btn btn-outline-light me-2">About</a>
            <a href="/contact" class="btn btn-outline-light">Contact</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white text-center">
            <h2>Loan Approval Prediction</h2>
        </div>

        <div class="card-body">

            <form action="/predict" method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Gender</label>
                        <select class="form-select" name="Gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Married</label>
                        <select class="form-select" name="Married" required>
                            <option value="">Select</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Dependents</label>
                        <select class="form-select" name="Dependents" required>
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3+">3+</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Education</label>
                        <select class="form-select" name="Education" required>
                            <option value="Graduate">Graduate</option>
                            <option value="Not Graduate">Not Graduate</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Self Employed</label>
                        <select class="form-select" name="Self_Employed" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Applicant Income</label>
                        <input type="number" class="form-control" name="ApplicantIncome" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Coapplicant Income</label>
                        <input type="number" class="form-control" name="CoapplicantIncome" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Loan Amount</label>
                        <input type="number" class="form-control" name="LoanAmount" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Loan Amount Term</label>
                        <input type="number" class="form-control" name="Loan_Amount_Term" placeholder="360" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Credit History</label>
                        <select class="form-select" name="Credit_History" required>
                            <option value="1">Good (1)</option>
                            <option value="0">Bad (0)</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Property Area</label>
                        <select class="form-select" name="Property_Area" required>
                            <option value="Urban">Urban</option>
                            <option value="Semiurban">Semiurban</option>
                            <option value="Rural">Rural</option>
                        </select>
                    </div>

                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">
                        Predict Loan
                    </button>

                    <a href="/" class="btn btn-secondary btn-lg ms-2">
                        Home
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
